name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test
        run: >-
          xcodebuild
          -project CodeInputEN.xcodeproj
          -scheme CodeInputEN
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test
